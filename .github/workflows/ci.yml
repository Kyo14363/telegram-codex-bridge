name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install editable package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint high-signal Python errors
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q .
      - name: Smoke tests
        run: python smoke_tests.py
      - name: Repository sanity checks
        run: python scripts/sanity_check.py
      - name: Package build
        run: python -m build
