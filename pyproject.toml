[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-codex-bridge"
version = "0.2.0"
description = "Self-hosted Telegram bridge for running Codex CLI maintainer workflows from mobile."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Kyo14363" }
]
keywords = [
  "codex",
  "openai",
  "telegram-bot",
  "maintainer-tools",
  "oss",
  "developer-tools",
  "automation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
  "python-telegram-bot==22.6",
  "requests==2.32.5",
  "trafilatura>=2.0.0",
  "yt-dlp>=2025.1.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0"
]
vision = [
  "google-genai"
]
extraction = [
  "langextract"
]

[project.urls]
Homepage = "https://github.com/Kyo14363/telegram-codex-bridge"
Repository = "https://github.com/Kyo14363/telegram-codex-bridge"
Issues = "https://github.com/Kyo14363/telegram-codex-bridge/issues"

[project.scripts]
telegram-codex-bridge = "telegram_bridge_codex:main"

[tool.setuptools]
py-modules = [
  "bridge_core",
  "config",
  "handlers",
  "metrics",
  "telegram_bridge_codex",
  "url_fetchers",
  "vision"
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
